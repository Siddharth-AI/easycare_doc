<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Point &amp; Incentive Module — Interactive</title>
<style>
:root{
  --bg:#0b1020;--panel:#131a2c;--panel2:#0f1626;--line:#243049;--line2:#2f3d5c;
  --txt:#e9eefb;--txt2:#a3b1cc;--txt3:#6b7c9c;
  --mother:#a855f7;--left:#22d3ee;--right:#f59e0b;--sel:#4ade80;--sponsor:#e879f9;
  --self:#4ade80;--direct:#60a5fa;--tl:#22d3ee;--tr:#f59e0b;--bad:#f87171;
  --shadow:0 10px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif;background:
  radial-gradient(1000px 500px at 80% -10%,rgba(168,85,247,.10),transparent),
  radial-gradient(900px 450px at 0% 0%,rgba(34,211,238,.08),transparent),var(--bg);
  color:var(--txt);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
header{padding:11px 20px;background:rgba(19,26,44,.7);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header h1{margin:0;font-size:1rem;font-weight:800;color:#e6d5ff;white-space:nowrap;}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:11px;border:1px solid var(--line);flex-wrap:wrap;}
.tab{border:none;background:transparent;color:var(--txt2);padding:7px 12px;border-radius:8px;font-weight:700;font-size:.79rem;cursor:pointer;white-space:nowrap;}
.tab.on{background:var(--mother);color:#fff;}
.grow{flex:1;}

.wrap{flex:1;display:flex;min-height:0;}
#stage{flex:1.7;min-width:0;overflow:hidden;position:relative;background:
  linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/26px 26px;}
#side{width:400px;flex-shrink:0;border-left:1px solid var(--line);padding:16px 18px;overflow:auto;background:rgba(15,22,38,.55);}
#side.hide{display:none;}

/* ---------- tree svg ---------- */
#treeSvg{display:block;width:100%;height:100%;cursor:grab;}
#treeSvg.drag{cursor:grabbing;}
.link{stroke:var(--line2);stroke-width:2.5;fill:none;}
.link.lft{stroke:rgba(34,211,238,.5);} .link.rgt{stroke:rgba(245,158,11,.45);}
.link.spon{stroke:var(--sponsor);stroke-width:1.8;stroke-dasharray:6 5;opacity:.7;}
.link.hot{stroke-width:5;}
.nd{cursor:pointer;}
.nd circle.body{stroke-width:3;transition:.25s;}
.nd.m circle.body{fill:#2a1846;stroke:var(--mother);}
.nd.l circle.body{fill:#0e2a33;stroke:var(--left);}
.nd.r circle.body{fill:#33260c;stroke:var(--right);}
.nd.sel circle.body{stroke:var(--sel);filter:drop-shadow(0 0 9px rgba(74,222,128,.75));}
.nd.hit circle.body{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 18px rgba(255,255,255,.95));}
.nd .lbl{fill:#fff;font-weight:800;font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.nd .tag{font-size:9px;fill:var(--txt3);font-weight:700;text-anchor:middle;pointer-events:none;}
.nd .stat{font-size:10px;font-weight:800;text-anchor:middle;pointer-events:none;}
.nd .stat.s{fill:var(--self);} .nd .stat.d{fill:var(--direct);}
.nd .stat.l{fill:var(--tl);} .nd .stat.r{fill:var(--tr);}
.ring-pulse{fill:none;stroke-width:3;opacity:0;}
.nd.hit .ring-pulse{animation:pulseRing 1s ease-out;}
@keyframes pulseRing{0%{r:24px;opacity:.9;}100%{r:56px;opacity:0;}}
.floaty{font-weight:800;text-anchor:middle;pointer-events:none;animation:floatUp 1.6s ease-out forwards;}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.1)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-44px)}}

/* ---------- DECK (non-tree tabs) ---------- */
.deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:74px 26px 130px;}
.scene{width:min(1020px,100%);max-height:100%;overflow:auto;scrollbar-width:none;}
.scene::-webkit-scrollbar{display:none;}
.scene h2{font-size:clamp(20px,2.4vw,30px);color:#e6d5ff;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;}
.scene .lead{color:var(--txt2);font-size:clamp(13px,1.15vw,16px);margin:0 0 16px;line-height:1.6;}
@keyframes pop{from{transform:translateY(14px) scale(.97)}to{transform:none}}
.scene>*{animation:pop .45s cubic-bezier(.2,.9,.3,1.3);}
.scene>*:nth-child(2){animation-delay:.06s} .scene>*:nth-child(3){animation-delay:.12s}
.scene>*:nth-child(4){animation-delay:.18s} .scene>*:nth-child(5){animation-delay:.24s}
.scene>*:nth-child(6){animation-delay:.3s} .scene>*:nth-child(7){animation-delay:.36s}

.big{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.stat{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;
  padding:16px 20px;min-width:150px;text-align:center;box-shadow:var(--shadow);flex:1;}
.stat .k{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);}
.stat .v{font-size:clamp(20px,2.6vw,34px);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1;}
.stat .n{font-size:.72rem;color:var(--txt3);margin-top:3px;}
.stat.gd{border-color:rgba(74,222,128,.5);} .stat.gd .v{color:#4ade80;}
.stat.bd{border-color:rgba(248,113,113,.5);} .stat.bd .v{color:#f87171;}
.stat.cy .v{color:#67e8f9;} .stat.am .v{color:#fcd34d;} .stat.pu .v{color:#c4b5fd;}
.arrowrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
.arw2{color:var(--txt3);font-weight:800;font-size:1.1rem;}

table.t{width:100%;border-collapse:collapse;font-size:clamp(11.5px,1.05vw,14px);margin:6px 0;}
table.t th{background:var(--panel2);color:#c4b5fd;text-align:left;padding:8px 10px;border:1px solid var(--line2);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;}
table.t td{padding:7px 10px;border:1px solid var(--line);color:var(--txt2);}
table.t td b{color:#fff;}
table.t tr.hl td{background:rgba(74,222,128,.13);}
table.t tr.bad td{background:rgba(248,113,113,.10);}

.note{border-radius:12px;padding:11px 15px;margin:10px 0;border-left:4px solid;font-size:clamp(12px,1.05vw,14.5px);line-height:1.6;}
.note.ok{background:rgba(74,222,128,.1);border-color:#4ade80;}
.note.ru{background:rgba(168,85,247,.1);border-color:var(--mother);}
.note.wa{background:rgba(245,158,11,.1);border-color:#f59e0b;}
.note.op{background:rgba(232,121,249,.1);border-color:var(--sponsor);}
.note b{color:#fde68a;}
.note .l{font-weight:800;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;}
.note.ok .l{color:#4ade80;} .note.ru .l{color:#c4b5fd;} .note.wa .l{color:#fcd34d;} .note.op .l{color:#f0abfc;}

.ctl{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;}
.ctl .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
.ctl .row>div{flex:1;min-width:120px;}
label.mini{font-size:.68rem;color:var(--txt3);font-weight:700;display:block;margin-bottom:3px;}
.ctl input,.ctl select{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:.88rem;font-weight:700;}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.btns button{flex:1;min-width:120px;border:none;border-radius:9px;padding:10px;font-weight:800;font-size:.82rem;cursor:pointer;}
.bRun{background:linear-gradient(90deg,#2563eb,#60a5fa);color:#04121e;}
.bNxt{background:linear-gradient(90deg,#0891b2,#22d3ee);color:#04121e;}
.bWk{background:linear-gradient(90deg,#d97706,#f59e0b);color:#1a1200;}
.bGr{background:#475569;color:#fff;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;border:1px solid var(--line2);background:var(--panel);color:var(--txt2);border-radius:8px;padding:7px;font-weight:700;font-size:.76rem;cursor:pointer;}
.seg button.on{background:var(--mother);border-color:var(--mother);color:#fff;}
.mono{font-family:Consolas,monospace;font-size:.85rem;color:#a5f3fc;}

/* ---------- shared chrome: step bar / zoom / robot ---------- */
.stepbar{position:absolute;top:13px;left:13px;z-index:20;display:flex;gap:6px;align-items:center;
  background:rgba(19,26,44,.92);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:12px;padding:6px 8px;flex-wrap:wrap;max-width:calc(100% - 120px);}
.stepbar button{border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:.79rem;cursor:pointer;white-space:nowrap;}
.stepbar button:disabled{opacity:.32;cursor:not-allowed;}
.sPlay{background:linear-gradient(90deg,#16a34a,#4ade80);color:#04180a;}
.sNext{background:linear-gradient(90deg,#0891b2,#22d3ee);color:#04121e;}
.sPrev{background:var(--panel);color:var(--txt2);border:1px solid var(--line2)!important;}
.sReplay{background:#475569;color:#fff;}
.stepcount{font-size:.75rem;color:var(--txt3);font-weight:800;padding:0 5px;white-space:nowrap;}
.pbar{height:5px;width:110px;background:var(--line);border-radius:4px;overflow:hidden;}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a855f7,#22d3ee);transition:width .4s;}

.zoombar{position:absolute;top:13px;right:13px;display:flex;flex-direction:column;gap:6px;z-index:20;}
.zoombar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(19,26,44,.9);backdrop-filter:blur(8px);color:var(--txt);font-size:1rem;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.zoombar button:hover{border-color:var(--mother);color:#e6d5ff;}
.zoombar .zlabel{font-size:.6rem;color:var(--txt3);text-align:center;}
.zoombar .fit{font-size:.65rem;}

.robot{position:absolute;left:16px;bottom:16px;z-index:30;display:flex;align-items:flex-end;gap:10px;pointer-events:none;max-width:min(620px,80%);}
.bot{width:68px;height:68px;flex-shrink:0;animation:hover 2.6s ease-in-out infinite;}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bot .pupil{fill:#22d3ee;animation:blink 3.4s infinite;}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bot .glow{animation:botGlow 2.2s ease-in-out infinite;}
@keyframes botGlow{0%,100%{opacity:.35}50%{opacity:.85}}
.bubble{background:linear-gradient(160deg,rgba(23,32,54,.97),rgba(15,22,38,.97));border:1px solid var(--line2);
  border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:clamp(12.5px,1.05vw,15px);line-height:1.6;color:var(--txt);
  box-shadow:0 12px 34px rgba(0,0,0,.55);min-height:42px;}
.bubble b{color:#fde68a;}
.bubble .k{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#c4b5fd;display:block;margin-bottom:3px;}
.bubble .self{color:var(--self);font-weight:800;} .bubble .direct{color:var(--direct);font-weight:800;}
.bubble .tl{color:var(--tl);font-weight:800;} .bubble .tr{color:var(--tr);font-weight:800;}
.bubble .gd{color:#4ade80;font-weight:800;} .bubble .bd{color:#f87171;font-weight:800;}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt3);margin-right:3px;animation:dotb 1s infinite;}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ---------- side panel (flow tab only) ---------- */
.kick{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:#c4b5fd;font-weight:800;margin-bottom:7px;}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:.7rem;color:var(--txt3);margin-bottom:12px;}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--txt2);}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.dot.self{background:var(--self);}.dot.direct{background:var(--direct);}.dot.tl{background:var(--tl);}.dot.tr{background:var(--tr);}.dot.spon{background:var(--sponsor);}
.ctrlbox{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px;}
.ctrlbox .h{font-size:.68rem;color:var(--txt3);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
.ctrlbox .who{font-size:.98rem;font-weight:800;color:#fff;margin:8px 0;}
.ctrlbox select,.ctrlbox input{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:.85rem;font-weight:700;}
button.buyBtn{border:none;border-radius:10px;padding:11px;font-weight:800;font-size:.85rem;cursor:pointer;width:100%;
  background:linear-gradient(90deg,#16a34a,#4ade80);color:#04180a;}
.tip{font-size:.78rem;color:var(--txt3);margin-top:8px;line-height:1.55;}
.log{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;max-height:200px;overflow-y:auto;}
.log .h{font-size:.68rem;color:var(--txt3);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
.log .ln{font-size:.78rem;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--txt2);font-family:Consolas,monospace;animation:logIn .35s ease;}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.log .ln:last-child{border-bottom:none;}
.log .ln b{color:#fff;}

@media(max-width:1150px){.wrap{flex-direction:column;}#side{width:auto;border-left:none;border-top:1px solid var(--line);}
  .robot{max-width:90%;} .bot{width:52px;height:52px;} .deck{padding:70px 14px 120px;}}
</style>
</head>
<body>
<header>
  <h1>💎 Point &amp; Incentive Module</h1>
  <div class="tabs">
    <button class="tab on" data-s="flow">🌳 Point Flow</button>
    <button class="tab" data-s="bpi">💰 BPI Matching</button>
    <button class="tab" data-s="cap">📊 Capping Levels</button>
    <button class="tab" data-s="startup">🚀 Startup Incentive</button>
    <button class="tab" data-s="mentor">🎓 Mentor's Incentive</button>
    <button class="tab" data-s="achiever">🏆 Achievers</button>
    <button class="tab" data-s="rules">📋 Rules &amp; Open Qs</button>
  </div>
  <div class="grow"></div>
</header>

<div class="wrap">
  <div id="stage"></div>
  <div id="side">
    <div class="kick">Interactive Simulation</div>
    <h2 style="font-size:1.15rem;margin:0 0 9px;color:#fff;">Purchase → Point Flow</h2>
    <div class="legend">
      <b><span class="dot self"></span>Self</b><b><span class="dot direct"></span>Direct</b>
      <b><span class="dot tl"></span>Left team</b><b><span class="dot tr"></span>Right team</b>
      <b><span class="dot spon"></span>Sponsor link</b>
    </div>
    <div class="ctrlbox">
      <div class="h">Kaun kharid raha (buyer)</div>
      <label class="mini">Buyer chuno (ya tree me node pe click karo)</label>
      <select id="buyerSel"></select>
      <div style="height:8px"></div>
      <label class="mini">Iska sponsor (badal ke test kar sakte ho)</label>
      <select id="sponsorSel"></select>
      <div class="who" id="selWho">U8</div>
      <label class="mini">Kitne PV ka product</label>
      <input type="number" id="amt" value="1000" step="500" min="500">
      <div style="height:9px"></div>
      <button class="buyBtn" id="buyBtn">🛒 Purchase chalao (step-by-step)</button>
      <div class="tip" id="selTip"></div>
    </div>
    <div class="log">
      <div class="h">Live ledger (audit history)</div>
      <div id="logList"><div class="ln">Node chuno → purchase chalao.</div></div>
    </div>
  </div>
</div>

<script>
/* =======================================================================
   SHARED HELPERS
   ======================================================================= */
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const $=id=>document.getElementById(id);

/* ---------- robot ---------- */
let sayTimer=null,lastSay=null;
function say(kicker,html){
  lastSay={kicker,html};
  const b=$('bubble'); if(!b) return;
  clearTimeout(sayTimer);
  b.innerHTML=`<span class="k">${kicker}</span><span class="dots"><span></span><span></span><span></span></span>`;
  sayTimer=setTimeout(()=>{ const bb=$('bubble'); if(bb) bb.innerHTML=`<span class="k">${kicker}</span>${html}`; },320);
}
const ROBOT_SVG=`<div class="robot">
  <svg class="bot" viewBox="0 0 100 100">
    <ellipse class="glow" cx="50" cy="54" rx="40" ry="34" fill="#22d3ee" opacity=".3"/>
    <line x1="50" y1="12" x2="50" y2="24" stroke="#a855f7" stroke-width="3"/><circle cx="50" cy="10" r="5" fill="#e879f9"/>
    <rect x="20" y="26" width="60" height="48" rx="16" fill="#1b2540" stroke="#3b82f6" stroke-width="3"/>
    <ellipse cx="38" cy="48" rx="9" ry="10" fill="#0b1020"/><ellipse cx="62" cy="48" rx="9" ry="10" fill="#0b1020"/>
    <circle class="pupil" cx="38" cy="48" r="4"/><circle class="pupil" cx="62" cy="48" r="4"/>
    <rect x="40" y="62" width="20" height="4" rx="2" fill="#22d3ee" opacity=".8"/>
    <rect x="12" y="42" width="7" height="18" rx="3" fill="#3b82f6"/><rect x="81" y="42" width="7" height="18" rx="3" fill="#3b82f6"/>
  </svg><div class="bubble" id="bubble"></div></div>`;
const STEPBAR=`<div class="stepbar">
  <button class="sPrev" id="sPrev">◀</button>
  <button class="sPlay" id="sPlay">▶ Auto play</button>
  <button class="sNext" id="sNext">Next ▶</button>
  <button class="sReplay" id="sReplay">↻</button>
  <span class="stepcount" id="stepCount">— / —</span>
  <div class="pbar"><i id="pbarI"></i></div></div>`;

/* =======================================================================
   TREE DATA (Point Flow tab)
   ======================================================================= */
const nodes={
  1:{id:1,left:2,right:3,parent:null,side:'root',sponsor:null},
  2:{id:2,left:4,right:5,parent:1,side:'left',sponsor:1},
  3:{id:3,left:null,right:13,parent:1,side:'right',sponsor:1},
  4:{id:4,left:6,right:7,parent:2,side:'left',sponsor:2},
  5:{id:5,left:12,right:null,parent:2,side:'right',sponsor:2},
  6:{id:6,left:8,right:9,parent:4,side:'left',sponsor:4},
  7:{id:7,left:10,right:11,parent:4,side:'right',sponsor:4},
  8:{id:8,left:null,right:null,parent:6,side:'left',sponsor:1},
  9:{id:9,left:null,right:null,parent:6,side:'right',sponsor:6},
  10:{id:10,left:null,right:null,parent:7,side:'left',sponsor:7},
  11:{id:11,left:null,right:null,parent:7,side:'right',sponsor:7},
  12:{id:12,left:null,right:null,parent:5,side:'left',sponsor:5},
  13:{id:13,left:null,right:null,parent:3,side:'right',sponsor:3},
};
Object.values(nodes).forEach(n=>{n.self=0;n.direct=0;n.teamL=0;n.teamR=0;});
let selId=8;
const labelOf=id=>id===1?'M':('U'+id);

const RX=160,RY=118,R=24;
let POS={},WORLD={w:1000,h:600},X,Y;
function layout(){
  POS={};let col=0,maxD=0;
  (function walk(id,d){const n=nodes[id];if(n.left)walk(n.left,d+1);POS[id]={col:col++,d};maxD=Math.max(maxD,d);if(n.right)walk(n.right,d+1);})(1,0);
  for(const id in POS){POS[id].x=60+POS[id].col*RX;POS[id].y=70+POS[id].d*RY;}
  WORLD={w:60+col*RX+60,h:70+(maxD+1)*RY+40};
  X=id=>POS[id].x; Y=id=>POS[id].y;
}
let cam={x:0,y:0,w:1000,h:600},camAnim=null;
function stageSize(){const s=$('stage');return{w:s.clientWidth||900,h:s.clientHeight||600};}
function applyCam(){const svg=$('treeSvg');if(!svg)return;svg.setAttribute('viewBox',`${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
  const z=$('zPct'); if(z) z.textContent=Math.round((stageSize().w/cam.w)*100)+'%';}
function setCam(t,animate){
  if(camAnim){clearInterval(camAnim);camAnim=null;}
  if(!animate){cam={...t};applyCam();return;}
  const from={...cam},t0=Date.now(),dur=620,ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  camAnim=setInterval(()=>{const p=Math.min(1,(Date.now()-t0)/dur),e=ease(p);
    cam={x:from.x+(t.x-from.x)*e,y:from.y+(t.y-from.y)*e,w:from.w+(t.w-from.w)*e,h:from.h+(t.h-from.h)*e};
    applyCam(); if(p>=1){clearInterval(camAnim);camAnim=null;}},16);
}

    setCam({x:mx-(mx-cam.x)*(w/cam.w),y:my-(my-cam.y)*(h/cam.h),w,h},false);},{passive:false});

/* =======================================================================
   DECK: BPI
   ======================================================================= */
let bDay=1,bWeek=1,bCarryL=0,bCarryR=0,bWeekTotal=0,bWashTotL=0,bWashTotR=0,bHist=[];
/* CARRY FORWARD & WASHOUT - final rule (client confirm):
   1. Matching pehle AAJ ka business kharch karti hai, uske baad purana carry.
   2. Purana carry jo bacha -> hamesha aage. Old carry KABHI wash nahi hota.
   3. Aaj ke business ka jo bacha -> wahi wash hota hai.
   4. Strong side = jiska total (carry + aaj) bada. Weak side = jiska chhota.
   5. Weak side pe wash nahi hua -> strong side pe bhi nahi hoga.
   6. Matching bani hi nahi -> kuch wash nahi, sab carry forward. */
function bpiCompute(oldL,oldR,todayL,todayR,cap){
  const availL=oldL+todayL,availR=oldR+todayR;
  const rawMatch=Math.floor(Math.min(availL,availR)/1000)*1000;
  const matched=Math.min(rawMatch,cap), payout=Math.round(matched*.8);
  const side=(c,t)=>{const tU=Math.min(t,matched),cU=Math.min(c,matched-tU);
    return {todayLeft:t-tU,carryLeft:c-cU,tUsed:tU,cUsed:cU};};
  const L=side(oldL,todayL),R=side(oldR,todayR);
  let washL=L.todayLeft,washR=R.todayLeft;
  const strongIsL=availL>availR, strongIsR=availR>availL;
  if(matched===0){washL=0;washR=0;}
  else{
    const weakWash = strongIsL?washR : (strongIsR?washL : Math.min(washL,washR));
    if(weakWash===0){ if(strongIsL)washL=0; else if(strongIsR)washR=0; else {washL=0;washR=0;} }
  }
  return {availL,availR,rawMatch,matched,payout,washL,washR,
    carryL:L.carryLeft+(L.todayLeft-washL),
    carryR:R.carryLeft+(R.todayLeft-washR),
    tUsedL:L.tUsed,tUsedR:R.tUsed,cUsedL:L.cUsed,cUsedR:R.cUsed,
    strongSide: strongIsL?'LEFT':(strongIsR?'RIGHT':'barabar'),
    weakSide: strongIsL?'RIGHT':(strongIsR?'LEFT':'barabar')};
}
function bpiRun(){
  const selfPV=+$('bSelf').value||0, lvl=levelFor(selfPV), cap=lvl[0]===0?0:lvl[2];
  const todayL=+$('bLeft').value||0, todayR=+$('bRight').value||0;
  const oldL=bCarryL,oldR=bCarryR;
  const r=bpiCompute(oldL,oldR,todayL,todayR,cap);
  bCarryL=r.carryL;bCarryR=r.carryR;bWashTotL+=r.washL;bWashTotR+=r.washR;bWeekTotal+=r.payout;
  bHist.push({d:bDay,oldL,todayL,oldR,todayR,cap,...r});
  bDay++;
  bpiPaint(r,lvl,oldL,oldR,todayL,todayR,cap);
  say('Matching hui',

function mentorRingHTML(){
  const c=['#4ade80','#22d3ee','#60a5fa','#a855f7','#f472b6'];
  let circles='',style='<style>',labels='';
  for(let i=0;i<5;i++){const r=38+i*24,len=2*Math.PI*r;
    circles+=`<circle cx="150" cy="150" r="${r}" fill="none" stroke="${c[i]}" stroke-width="9" stroke-dasharray="${len}" stroke-dashoffset="${len}" style="animation:dr${i} .9s ease forwards ${i*.14}s"/>`;
    style+=`@keyframes dr${i}{to{stroke-dashoffset:0}}`;
    labels+=`<text x="150" y="${150-38-i*24}" fill="${c[i]}" font-size="10.5" font-weight="800" text-anchor="middle">L${i+1} · 7%</text>`;}
  return `${style}</style><svg width="310" height="310" viewBox="0 0 300 300" style="display:block;margin:0 auto">
    <circle cx="150" cy="150" r="13" fill="#a855f7"/><text x="150" y="154" fill="#fff" font-size="9.5" font-weight="800" text-anchor="middle">YOU</text>
    ${circles}${labels}</svg>`;
}

let aLvl=4,aDone=1;
function achCalcHTML(){
  return `<h2>🧮 Kitna milega — khud dekho</h2>
   <p class="lead">Achiever ko uske <b>aakhri 3 qualified levels</b> ka pool milta hai.</p>
   <div class="ctl">

     <div class="seg" id="aLvlSeg"><button data-v="3">Level 3</button><button data-v="4" class="on">Level 4</button><button data-v="5">Level 5</button></div>
     <div style="height:9px"></div>
     <label class="mini">Us top level ka criteria complete kiya?</label>
     <div class="seg" id="aDoneSeg"><button data-v="1" class="on">Haan</button><button data-v="0">Nahi</button></div>
   </div>
   <div id="aOut"></div>`;
}
function achWire(){
  const calc=()=>{
    const L=[]; for(let l=aLvl-2;l<=aLvl;l++){ if(l<1)continue; if(l===aLvl&&!aDone)continue; L.push(l); }
    const total=L.reduce((s,l)=>s+ACH_PER[l],0);
    $('aOut').innerHTML=`<div class="big">
        <div class="stat pu"><div class="k">Kaunse levels</div><div class="v" style="font-size:1.4rem">${L.join(' + ')||'—'}</div></div>
        <div class="arw2">=</div>
        <div class="stat gd"><div class="k">Total milega</div><div class="v">${fmt(total)}</div><div class="n">PV</div></div>
      </div>
      <div class="note ${aDone?'ok':'wa'}"><span class="l">Hisaab</span>${L.map(l=>fmt(ACH_PER[l])).join(' + ')||'kuch nahi'} = <b>${fmt(total)} PV</b>${!aDone?` · top level ka criteria adhoora hai isliye <b>Level ${aLvl} nahi gina</b>.`:''}</div>`;
    say('Result',`Level <b>${aLvl}</b> pe, criteria <b>${aDone?'complete':'incomplete'}</b> → milenge <b>Level ${L.join(' + ')||'—'}</b> = <span class="gd">${fmt(total)} PV</span>.`);
  };
  const seg=(id,cb)=>$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(+b.dataset.v);};
  seg('aLvlSeg',v=>{aLvl=v;calc();}); seg('aDoneSeg',v=>{aDone=v;calc();}); calc();
}

/* =======================================================================
   TAB ENGINE
   ======================================================================= */
const DECKS={bpi:DECK_BPI,cap:DECK_CAP,startup:DECK_START,mentor:DECK_MENTOR,achiever:DECK_ACH,rules:DECK_RULES};
const INTRO={
  bpi:['BPI Matching','Ye tab <b>BPI</b> samjhata hai — daily Left-Right matching, capping, carry forward aur washout. Aakhir me <b>live simulator</b> bhi hai.'],
  cap:['Capping Levels','Yahan dekho ki <b>Self PV</b> tumhara daily cap kaise decide karti hai — 8 levels ke saath.'],
  startup:['Startup Incentive','Naye member ka <b>one-time bonus</b> — direct PV ke 2 milestones pe.'],
  mentor:['Mentor\'s Incentive','<b>Sponsor tree</b> pe chalne wala incentive — 5 levels, har level 7%, max 35%.'],
  achiever:['Achievers','Ranks, tours aur company turnover me se hissa — plus "last 3 levels" ka rule.'],
  rules:['Rules &amp; Open Qs','Poore module ke rules ek jagah, aur jo cheezein <b>abhi confirm karni hain</b> wo bhi.'],
};
let cur='flow';
function show(){
  stopPlay();
  const isFlow=cur==='flow';
  $('side').classList.toggle('hide',!isFlow);
  if(isFlow){
    mode='flow'; lastSay=null;
    buildFlowSteps(); renderTree(false); syncSide();
    say('Namaste 👋',`Main tumhara guide hoon. Buyer <b>${labelOf(selId)}</b> select hai — <b>Next ▶</b> ya <b>Auto play</b> dabao, main har step ek-ek karke samjhaunga. Zoom: ＋ / − ya mouse wheel, drag karke ghuma sakte ho.`);
    return;
  }
  mode='deck'; steps=DECKS[cur]; stepIdx=-1; lastSay=null;
  renderDeckShell();
  const [t,d]=INTRO[cur];
  say('Namaste 👋 · '+t, d+' <b>Next ▶</b> dabao ya <b>Auto play</b> chala do.');
  runDeckStep(-1); syncStepUI();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); cur=t.dataset.s; show();
});
$('buyBtn').onclick=()=>{stopPlay();buildFlowSteps();gotoFlowStep(-1);startPlay();};
$('buyerSel').onchange=e=>pick(+e.target.value);
$('sponsorSel').onchange=e=>{
  const v=+e.target.value; nodes[selId].sponsor=v||null;
  if(playing)stopPlay(); buildFlowSteps(); renderTree(true); syncSide(); gotoFlowStep(-1);
  say('Sponsor badla',`<b>${labelOf(selId)}</b> ka sponsor ab <b>${v?labelOf(v):'koi nahi'}</b> hai. Purchase chala ke dekho — Direct point kahan jaata hai.`);
};
window.addEventListener('resize',()=>{ if(cur==='flow') renderTree(true); });
show();
</script>
