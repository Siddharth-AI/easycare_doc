<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Flow — Shop / Pincode / Commission</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0; background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    background: #1e293b; padding: 12px 20px; border-bottom: 2px solid #334155;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 1.1rem; margin: 0; color: #93c5fd; }
  .chapter { font-size: 0.85rem; color: #94a3b8; }
  .wrap { display: flex; flex: 1; min-height: 0; }
  #board {
    position: relative; width: 900px; height: 620px;
    margin: 16px; background: #111827; border-radius: 14px;
    border: 1px solid #334155; flex-shrink: 0;
    background-image: radial-gradient(#1f2937 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #side {
    flex: 1; padding: 20px 24px; min-width: 280px;
    display: flex; flex-direction: column;
  }
  #stepTitle { color: #fbbf24; font-size: 1.25rem; margin: 0 0 10px; }
  #stepBody { font-size: 1rem; line-height: 1.7; flex: 1; }
  #stepBody b { color: #fde68a; }
  .pill { display:inline-block; padding:2px 9px; border-radius:12px; font-size:0.8rem; font-weight:700; color:#fff; }
  .p-wh{background:#1e3a8a;} .p-mw{background:#7c3aed;} .p-l1{background:#2563eb;}
  .p-l2{background:#0891b2;} .p-l3{background:#059669;} .p-u{background:#f59e0b;}

  /* nodes */
  .node {
    position: absolute; width: 122px; min-height: 50px;
    border-radius: 10px; color: #fff; font-size: 0.8rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; line-height: 1.25; white-space: pre-line;
    opacity: 0; transform: scale(0.6); transition: all .45s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 4px 12px rgba(0,0,0,.4); border: 2px solid transparent;
  }
  .node.show { opacity: 1; transform: scale(1); }
  .node.hi { border-color: #fde047; box-shadow: 0 0 0 4px rgba(253,224,71,.35), 0 4px 14px rgba(0,0,0,.5); }
  .node.dim { opacity: .28; }
  .wh{background:#1e3a8a;} .mw{background:#7c3aed;} .l1{background:#2563eb;}
  .l2{background:#0891b2;} .l3{background:#059669;} .u{background:#f59e0b;} .admin{background:#db2777;}

  .badge {
    position:absolute; background:#0b1220; border:1px solid #475569;
    color:#7dd3fc; font-size:0.72rem; padding:3px 8px; border-radius:8px;
    opacity:0; transition:opacity .4s; font-weight:600; white-space:nowrap;
  }
  .badge.show{opacity:1;}

  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .edge { stroke:#475569; stroke-width:2.5; fill:none; opacity:0; transition:opacity .4s; }
  .edge.show{opacity:1;}
  .edge.dash{stroke-dasharray:6 6; stroke:#ef4444;}
  .edgelbl{ fill:#cbd5e1; font-size:11px; font-weight:600; opacity:0; transition:opacity .4s;}
  .edgelbl.show{opacity:1;}

  #token {
    position:absolute; width:54px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:700; color:#fff; z-index:5;
    opacity:0; transition: opacity .3s; box-shadow:0 3px 10px rgba(0,0,0,.5);
  }

  footer {
    background:#1e293b; padding:12px 20px; border-top:2px solid #334155;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  button {
    background:#2563eb; color:#fff; border:none; padding:9px 18px;
    border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer;
    transition: background .2s;
  }
  button:hover{ background:#1d4ed8; }
  button:disabled{ background:#475569; cursor:not-allowed; opacity:.6; }
  #play{ background:#059669; } #play:hover{ background:#047857; }
  #reset{ background:#64748b; }
  .prog { flex:1; height:8px; background:#334155; border-radius:5px; overflow:hidden; min-width:120px; }
  .prog > i { display:block; height:100%; background:#3b82f6; width:0; transition:width .3s; }
  .count{ font-size:0.85rem; color:#94a3b8; min-width:64px; text-align:right; }
  @media(max-width:1280px){ .wrap{flex-direction:column;} #board{margin:12px auto;} }
</style>
</head>
<body>

<header>
  <h1>🔄 Interactive System Flow</h1>
  <span class="chapter" id="chapter">Chapter —</span>
</header>

<div class="wrap">
  <div id="board">
    <svg id="lines"></svg>
    <div id="token"></div>
    <!-- nodes injected -->
  </div>
  <div id="side">
    <h2 id="stepTitle">Start</h2>
    <div id="stepBody">Press <b>Next ▶</b> ya <b>Auto-play</b> to begin.</div>
  </div>
</div>

<footer>
  <button id="back">◀ Back</button>
  <button id="next">Next ▶</button>
  <button id="play">▶ Auto-play</button>
  <button id="reset">↻ Reset</button>
  <div class="prog"><i id="bar"></i></div>
  <span class="count" id="count">0 / 0</span>
</footer>

<script>

  S1:   {x:90,  y:225, cls:'l1', label:'🏪 S1\nLevel 1'},
  S2:   {x:389, y:225, cls:'l1', label:'🏪 S2\nLevel 1'},
  S3:   {x:688, y:225, cls:'l1', label:'🏪 S3\nLevel 1'},
  S31:  {x:600, y:345, cls:'l2', label:'S3.1\nLevel 2'},

const W=122, H=50;
const cx = id => NODES[id].x + W/2;

// ---------- build DOM nodes ----------
const board = document.getElementById('board');
const svg = document.getElementById('lines');
const token = document.getElementById('token');
const nodeEls = {};
for (const id in NODES){
  const n = NODES[id];
  const d = document.createElement('div');
  d.className = 'node ' + n.cls;
  d.style.left = n.x+'px'; d.style.top = n.y+'px';
  d.textContent = n.label;
  d.id = 'node-'+id;
  board.appendChild(d);
  nodeEls[id] = d;
}

const A = id => id; // alias

   edges:[['WH','MW'],['MW','S1'],['MW','S2'],['MW','S3'],['S3','S31'],['S3','S311']],

   hi:['U2','ADMIN'] },

   b:'Chain: <b>WH → L1 → L2 → User</b>. Is raaste me <b>L3 aata hi nahi</b> — wo L1 ki doosri branch hai.<br>Sirf <b>do level</b> ko commission: L1 aur L2.',

   edges:[['WH','S3','800'],['S3','S31','800'],['S31','U2','800']],
   hi:['S3','S31'],

   edges:[['WH','S3','800'],['S3','S311','800'],['S311','U2','800']],
   hi:['S3','S311'],

   edges:[['WH','S3','800'],['S3','S31','800'],['S3','S311','800']],

   edges:[['WH','S3','800'],['S3','U2','800']],
   hi:['S3','WH'],
   badge:{S3:'💰 50 (50%)', WH:'💰 50 (50%)'} },

 { ch:'8. Commission — Case D ⭐', t:'⭐ L1 user ko 900 me beche (markup)',

   edges:[['WH','S3','800'],['S3','U2','becha 900']],

   edges:[['WH','S3','800'],['S3','S311','800'],['S311','U2','becha 900']],

// ---------- render ----------
let cur = -1, playing=false, playTimer=null, animTimers=[];

function clearAnim(){ animTimers.forEach(clearTimeout); animTimers=[]; token.style.opacity=0; }

function render(i){
  clearAnim();
  const s = STEPS[i];
  document.getElementById('chapter').textContent = 'Chapter ' + s.ch;
  document.getElementById('stepTitle').innerHTML = s.t;
  document.getElementById('stepBody').innerHTML = s.b;
  const shown = new Set(s.nodes||[]);
  const hi = new Set(s.hi||[]);
  const dim = new Set(s.dim||[]);

  // nodes
  for (const id in nodeEls){
    const el = nodeEls[id];
    el.classList.toggle('show', shown.has(id));
    el.classList.toggle('hi', hi.has(id));
    el.classList.toggle('dim', dim.has(id));
  }

  // edges
  svg.innerHTML='';
  (s.edges||[]).forEach(e=>{
    const [a,b,lbl,dash] = e;
    if(!shown.has(a)||!shown.has(b)) return;
    const x1=cx(a), y1=cy(a), x2=cx(b), y2=cy(b);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('class','edge show'+(dash?' dash':''));
    svg.appendChild(line);
    if(lbl){
      const frac = (e[4]!==undefined)?e[4]:0.5;
      const len = Math.hypot(x2-x1, y2-y1) || 1;
      const side = frac<0.5 ? -1 : 1;
      const ox = (-(y2-y1)/len)*16*side;
      const oy = ((x2-x1)/len)*16*side;
      const lx = x1+(x2-x1)*frac + ox;
      const ly = y1+(y2-y1)*frac + oy;
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',lx); txt.setAttribute('y',ly);
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('class','edgelbl show');
      txt.textContent=lbl;
      svg.appendChild(txt);
    }
  });

  // badges
  document.querySelectorAll('.badge').forEach(b=>b.remove());
  if(s.badge){
    for(const id in s.badge){
      if(!shown.has(id)) continue;
      const bd=document.createElement('div');
      bd.className='badge show';
      bd.textContent=s.badge[id];
      bd.style.left=(NODES[id].x + W + 8)+'px';
      bd.style.top=(NODES[id].y + 14)+'px';
      board.appendChild(bd);
    }
  }

  // animation
  if(s.anim) runAnim(s.anim);

  // controls
  document.getElementById('count').textContent=(i+1)+' / '+STEPS.length;
  document.getElementById('bar').style.width=((i+1)/STEPS.length*100)+'%';
  document.getElementById('back').disabled = i<=0;
  document.getElementById('next').disabled = i>=STEPS.length-1;
}

function runAnim(a){
  const path=a.path;
  token.style.background=a.color;
  token.textContent=a.label;
  // place at start
  token.style.transition='none';
  token.style.left=(cx(path[0])-27)+'px';
  token.style.top=(cy(path[0])-15)+'px';
  token.style.opacity=1;
  let step=0;
  const move=()=>{
    step++;
    if(step>=path.length){
      animTimers.push(setTimeout(()=>{ token.style.opacity=0; },500));
      return;
    }
    token.style.transition='left .7s ease, top .7s ease';
    token.style.left=(cx(path[step])-27)+'px';
    token.style.top=(cy(path[step])-15)+'px';
    animTimers.push(setTimeout(move,780));
  };
  animTimers.push(setTimeout(move,300));
}

function go(i){
  if(i<0||i>=STEPS.length) return;
  cur=i; render(cur);
}
function next(){ if(cur<STEPS.length-1) go(cur+1); else stopPlay(); }
function back(){ if(cur>0) go(cur-1); }

function startPlay(){
  playing=true;
  document.getElementById('play').textContent='⏸ Pause';
  if(cur>=STEPS.length-1) go(0);
  const tick=()=>{
    if(!playing) return;
    if(cur>=STEPS.length-1){ stopPlay(); return; }
    next();
    playTimer=setTimeout(tick, 3200);
  };
  playTimer=setTimeout(tick, 600);
}
function stopPlay(){
  playing=false; clearTimeout(playTimer);
  document.getElementById('play').textContent='▶ Auto-play';
}

document.getElementById('next').onclick=()=>{ stopPlay(); next(); };
document.getElementById('back').onclick=()=>{ stopPlay(); back(); };
document.getElementById('reset').onclick=()=>{ stopPlay(); go(0); };
document.getElementById('play').onclick=()=>{ playing?stopPlay():startPlay(); };
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ stopPlay(); next(); }
  if(e.key==='ArrowLeft'){ stopPlay(); back(); }
});

go(0);
</script>
</body>
</html>
